_format_version: "3.0"

services:
  - name: genie-api
    url: http://genie-fastapi:8002
    routes:
      - name: genie-api-route
        paths:
          - /api
        strip_path: true

plugins:
  - name: rate-limiting
    config:
      minute: 300
      policy: local

  - name: file-log
    config:
      path: /dev/stdout