services:

  genie-mongodb:
    image: mongo:7.0
    container_name: genie-mongodb
    restart: always
    ports:
      - "27018:27017"
    networks:
      - genie_network
    volumes:
      - genie_mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${GENIE_MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${GENIE_MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE:      ${MONGO_DB}
    healthcheck:
      test: "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
      interval: 10s
      timeout: 5s
      retries: 5

  genie-mongo-express:
    image: mongo-express:latest
    container_name: genie-mongo-express
    restart: on-failure
    depends_on:
      genie-mongodb:
        condition: service_healthy
    networks:
      - genie_network
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${GENIE_MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${GENIE_MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${GENIE_MONGO_ROOT_USERNAME}:${GENIE_MONGO_ROOT_PASSWORD}@genie-mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${GENIE_MONGOEXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${GENIE_MONGOEXPRESS_PASSWORD}

  genie-api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: genie-fastapi
    restart: always
    ports:
      - "8002:8002"
    networks:
      - genie_network
    depends_on:
      genie-mongodb:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./Credentials.json:/app/Credentials.json
      - ./token.json:/app/token.json
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  genie-streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: genie-streamlit
    restart: always
    ports:
      - "8502:8501"
    networks:
      - genie_network
    depends_on:
      genie-api:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
  
  kong:
    image: kong:3.6
    container_name: genie-kong
    restart: always
    networks:
      - genie_network
    ports:
      - "8080:8000"
      - "8090:8001"  
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml
    depends_on:
      genie-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5



volumes:
  genie_mongodb_data:

networks:
  genie_network:
    driver: bridge